
<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AimSense Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      // מניעת קריסה במקרה ש-process.env לא הוגדר כראוי בדפדפן
      window.process = window.process || { env: { API_KEY: "" } };
      
      // לכידת שגיאות והצגת הודעה למשתמש במקרה של תקלה קריטית
      window.onerror = function(msg, url, line) {
        const root = document.getElementById('root');
        if (root && !root.innerHTML.trim()) {
          root.innerHTML = `<div style="color:white; background:#18181b; padding:40px; text-align:center; font-family:sans-serif;">
            <h2 style="color:#ef4444;">שגיאה בטעינת האפליקציה</h2>
            <p style="color:#a1a1aa;">אנא וודא שהדפדפן שלך מעודכן ושכל קבצי ה-JavaScript נטענו כראוי.</p>
            <small style="color:#52525b;">${msg}</small>
          </div>`;
        }
      };
    </script>
    <style>
      body {
        font-family: 'Rubik', 'Inter', sans-serif;
        background-color: #0a0a0c;
        color: #e4e4e7;
        margin: 0;
      }
      .glass {
        background: rgba(24, 24, 27, 0.8);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(63, 63, 70, 0.4);
      }
      .accent-gradient {
        background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4",
        "@google/genai": "https://esm.sh/@google/genai@^1.41.0"
      }
    }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="flex items-center justify-center min-h-screen">
        <div class="text-center animate-pulse">
          <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
          <p class="text-zinc-500">טוען את AimSense Pro...</p>
        </div>
      </div>
    </div>
  </body>
</html>
