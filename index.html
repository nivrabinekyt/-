
<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AimSense Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.process = { env: { API_KEY: "" } };
      window.onerror = function(msg) {
        const root = document.getElementById('root');
        if (root && !root.innerHTML.trim()) {
          root.innerHTML = `<div style="color:#ef4444; background:#0a0a0c; height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; font-family:sans-serif; padding:20px;">
            <div><h2 style="font-size:24px; font-weight:bold;">שגיאה בטעינה</h2><p style="color:#a1a1aa;">${msg}</p></div>
          </div>`;
        }
      };
    </script>
    <style>
      :root {
        --bg: #0a0a0c;
        --accent: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background-color: var(--bg);
        color: #e4e4e7;
        margin: 0;
        -webkit-font-smoothing: antialiased;
      }
      .glass {
        background: rgba(24, 24, 27, 0.7);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(63, 63, 70, 0.3);
      }
      .accent-gradient { background: var(--accent); }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: var(--bg); }
      ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@19.0.0/",
        "react/": "https://esm.sh/react@19.0.0/",
        "react": "https://esm.sh/react@19.0.0",
        "@google/genai": "https://esm.sh/@google/genai@1.41.0"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
